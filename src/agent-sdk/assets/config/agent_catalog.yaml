# The agent graph: infrastructure only. Persona, skills and tool grants live in each
# agent's profile (assets/agents/<name>.yml); this file carries the graph edges,
# required outputs and native Claude Agent SDK subagent controls.
#
# - An orchestrator (`orchestrator: true`) runs as the session's MAIN thread and is the
#   only kind of agent that dispatches; `handoffs` is its roster of subagents.
# - A subagent (`orchestrator: false`) is dispatched one-shot and context-isolated, and
#   never dispatches. Dispatch is one level deep by construction.
#
# Skills that fan out their own workers (/fetch, /corpus-probe, /runway-probe) belong to an
# orchestrator; the workers they launch are the leaf subagents below.
agents:

  - name: chief
    agentProfile: assets/agents/chief.yml
    handoffs: [news-scout, macro-analyst, theme-analyst, sentiment-analyst, tone-grader, ticker-analyst, record-keeper]
    requiredOutputs: [chief-report.md]
    orchestrator: true
    sdk:
      model: claude-opus-5-5
      effort: high
      maxTurns: 100
      permissionMode: default
      background: false
      mcpServers: [run_context, run_guide]

  - name: corpus-lead
    agentProfile: assets/agents/corpus-lead.yml
    handoffs: [macro-analyst, news-scout, extractor, evidence-reader]
